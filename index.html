<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LOTO AI • Dashboard Histórico</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

  <style>
    :root {
      --bg: #050a14;
      --card: rgba(20, 30, 50, 0.65); 
      --border: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
      --text-muted: #a0aec0;
      --neon-cyan: #00f2ff;
      --gold: #ffd700;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image: radial-gradient(circle at 50% 0%, rgba(0, 242, 255, 0.1) 0%, transparent 60%);
      padding-bottom: 50px;
    }

    .container { max-width: 1400px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* --- Timer --- */
    .timer { display: flex; justify-content: center; gap: 1rem; margin: 2rem 0; flex-wrap: wrap; }
    .time-box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 1rem; padding: 1rem 1.5rem; text-align: center; min-width: 90px;
    }
    .time-num { font-size: 2rem; font-weight: 900; color: var(--neon-cyan); }
    .time-label { font-size: 0.7rem; color: var(--text-muted); letter-spacing: 1px; margin-top: 5px; }

    /* --- Buscador (Arriba) --- */
    .search-wrapper {
      max-width: 500px; margin: 0 auto 3rem; text-align: center;
    }
    #search {
      width: 100%; padding: 1rem 1.5rem; border-radius: 99px;
      background: var(--card); border: 1px solid var(--border); color: white;
      font-size: 1.1rem; text-align: center;
    }
    #search:focus { outline: none; border-color: var(--neon-cyan); box-shadow: 0 0 20px rgba(0,242,255,0.2); }

    /* --- Controles de Tabla (Abajo) --- */
    .table-controls {
      display: flex; justify-content: flex-end; align-items: center; 
      margin-bottom: 1rem; padding: 0 0.5rem;
    }

    /* Toggle Switch Styles */
    .toggle-switch {
      position: relative; display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .slider {
      position: relative; width: 44px; height: 24px;
      background-color: rgba(255,255,255,0.1); border-radius: 34px;
      transition: .4s; border: 1px solid rgba(255,255,255,0.2);
    }
    .slider:before {
      position: absolute; content: ""; height: 18px; width: 18px;
      left: 2px; bottom: 2px; background-color: white;
      border-radius: 50%; transition: .4s;
    }
    input:checked + .slider { background-color: rgba(0, 255, 157, 0.4); border-color: #00ff9d; }
    input:checked + .slider:before { transform: translateX(20px); background-color: #00ff9d; box-shadow: 0 0 10px #00ff9d; }
    .label-text { font-size: 0.9rem; color: var(--text-muted); transition: color 0.3s; }
    input:checked ~ .label-text { color: #00ff9d; font-weight: bold; }

    /* --- Hero Dashboard --- */
    .hero {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 2rem; padding: 2rem; margin-bottom: 3rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .hero-header { text-align: center; margin-bottom: 2rem; }
    .hero-title { font-size: 2.5rem; font-weight: 900; color: white; margin: 0.5rem 0; }
    .hero-date { color: var(--text-muted); font-size: 1.1rem; }

    .hero-stats {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 3rem; margin-bottom: 3rem; text-align: center;
    }
    .stat-val { font-size: 2rem; font-weight: 700; color: #ff00c8; }
    .stat-lbl { color: var(--text-muted); font-size: 0.9rem; }

    /* --- Swiper --- */
    .swiper { padding: 10px; padding-bottom: 40px !important; }
    
    .ball {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1rem; color: white;
      box-shadow: inset 0 -3px 8px rgba(0,0,0,0.4), 0 4px 8px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.3);
    }
    .ball.LOTO { background: radial-gradient(circle at 30% 30%, #ffd700, #bfa100); text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
    .ball.RECARGADO { background: radial-gradient(circle at 30% 30%, #ff5cb4, #c90076); }
    .ball.REVANCHA { background: radial-gradient(circle at 30% 30%, #d67aff, #8a00e0); }
    .ball.DESQUITE { background: radial-gradient(circle at 30% 30%, #5ceaff, #0088cc); }
    .ball.AHORA_SI_QUE_SI { background: radial-gradient(circle at 30% 30%, #22d3ee, #0891b2); }
    .ball.COMODIN { background: transparent; border: 2px solid #ff3b5c; color: #ff3b5c; box-shadow: 0 0 10px rgba(255, 59, 92, 0.3); }

    /* --- Tabla Historial --- */
    .table-wrapper { 
      background: var(--card); border: 1px solid var(--border);
      border-radius: 1.5rem; overflow: hidden;
    }
    .table-scroll { max-height: 600px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { position: sticky; top: 0; background: #0a1020; padding: 1rem; text-align: left; color: var(--neon-cyan); z-index: 10; font-size: 0.9rem; text-transform: uppercase; }
    td { padding: 1rem; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
    tr:hover { background: rgba(255,255,255,0.03); }
    
    .status-bar { text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.8rem; }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="timer">
      <div class="time-box"><div class="time-num" id="days">00</div><div class="time-label">DÍAS</div></div>
      <div class="time-box"><div class="time-num" id="hours">00</div><div class="time-label">HRS</div></div>
      <div class="time-box"><div class="time-num" id="mins">00</div><div class="time-label">MIN</div></div>
      <div class="time-box"><div class="time-num" id="secs">00</div><div class="time-label">SEG</div></div>
    </div>

    <div class="search-wrapper">
      <input type="number" id="search" placeholder="🔍 Buscar sorteo (ej: 5352)..." />
    </div>

    <div class="hero" id="dashboard">
      <div class="hero-header">
        <div class="hero-date" id="dash-date">Cargando...</div>
        <h1 class="hero-title" id="dash-title">Sorteo #---</h1>
      </div>

      <div class="hero-stats">
        <div>
            <div class="stat-val" id="dash-money">$0</div>
            <div class="stat-lbl">Total repartido estimado</div>
        </div>
        <div>
            <div class="stat-val" id="dash-winners">0</div>
            <div class="stat-lbl">Ganadores totales</div>
        </div>
      </div>

      <div class="swiper">
        <div class="swiper-wrapper" id="games-container"></div>
        <div class="swiper-pagination"></div>
      </div>
    </div>

    <div class="table-controls">
      <label class="toggle-switch">
        <input type="checkbox" id="filter-winners">
        <span class="slider"></span>
        <span class="label-text">Ver solo con Ganadores</span>
      </label>
    </div>

    <div class="table-wrapper">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Sorteo</th>
              <th>Fecha</th>
              <th>Números Loto</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </div>

    <div style="text-align: center; margin-top: 2.5rem; margin-bottom: 1rem;">
      <a href="auditoria.html" style="
          display: inline-flex; align-items: center; gap: 10px;
          background: rgba(0, 255, 65, 0.05); /* Matrix Green sutil */
          border: 1px solid rgba(0, 255, 65, 0.3);
          color: #00ff41;
          padding: 0.8rem 1.5rem;
          border-radius: 6px;
          text-decoration: none;
          font-family: 'JetBrains Mono', monospace;
          font-weight: 700;
          font-size: 0.85rem;
          letter-spacing: 1px;
          transition: all 0.3s ease;
          text-transform: uppercase;
      " 
      onmouseover="this.style.background='rgba(0, 255, 65, 0.15)'; this.style.boxShadow='0 0 15px rgba(0, 255, 65, 0.2)'; this.style.borderColor='#00ff41'" 
      onmouseout="this.style.background='rgba(0, 255, 65, 0.05)'; this.style.boxShadow='none'; this.style.borderColor='rgba(0, 255, 65, 0.3)'">
        <i data-lucide="shield-check" style="width: 18px;"></i>
        ACCEDER A AUDITORÍA DEL SISTEMA
      </a>
    </div>

    <div class="status-bar" id="status-text">Conectando con base de datos...</div>
  </div>

  <script>
    lucide.createIcons();
    
    let allData = [];
    let sortedData = [];

    function formatMoney(n) {
      return '$' + Number(n).toLocaleString('es-CL');
    }

    try {
      Papa.parse('LOTO_HISTORIAL_MAESTRO.csv', {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          allData = results.data;
          
          const validData = allData.filter(row => row.sorteo && row.sorteo.trim() !== '');
          const lastDraw = validData[validData.length - 1];
          
          if(lastDraw) {
             renderDashboard(lastDraw);
             // Solo establecemos el max para validación HTML, pero no el value visual
             const searchInput = document.getElementById('search');
             if(searchInput) searchInput.max = lastDraw.sorteo;
          }

          sortedData = validData.slice().reverse();
          updateHistoryTable();
          
          const statusText = document.getElementById('status-text');
          if(statusText) statusText.style.display = 'none';
        }
      });
    } catch(e) {
      console.error("Error inicial:", e);
      document.getElementById('status-text').textContent = "Error al iniciar la carga de datos.";
    }

    function renderDashboard(row) {
      let totalRepartido = 0;
      let totalGanadores = 0;

      Object.keys(row).forEach(key => {
        if (key.endsWith('_GANADORES')) {
          const winners = parseInt(row[key]) || 0;
          if (winners > 0) {
            totalGanadores += winners;
            const prefix = key.replace('_GANADORES', '');
            const amountKey = prefix + '_MONTO';
            const amount = parseInt(row[amountKey]) || 0;
            totalRepartido += (winners * amount);
          }
        }
      });

      const elDate = document.getElementById('dash-date');
      const elTitle = document.getElementById('dash-title');
      const elMoney = document.getElementById('dash-money');
      const elWinners = document.getElementById('dash-winners');

      if(elDate) elDate.innerText = row.fecha ? row.fecha.split(' ')[0] : '---';
      if(elTitle) elTitle.innerText = `Sorteo #${row.sorteo}`;
      if(elMoney) elMoney.innerText = formatMoney(totalRepartido);
      if(elWinners) elWinners.innerText = totalGanadores.toLocaleString('es-CL');

      const gamesConfig = [
        { key: 'LOTO', title: 'LOTO CLÁSICO', color: '#facc15' },
        { key: 'RECARGADO', title: 'RECARGADO', color: '#fbbf24' },
        { key: 'REVANCHA', title: 'REVANCHA', color: '#f87171' },
        { key: 'DESQUITE', title: 'DESQUITE', color: '#34d399' },
        { key: 'AHORA_SI_QUE_SI', title: 'AHORA SÍ QUE SÍ', color: '#22d3ee' }
      ];

      const swiperWrapper = document.getElementById('games-container');
      let slidesHtml = '';

      gamesConfig.forEach(game => {
        const n1 = row[`${game.key}_n1`];
        if (!n1 || n1.toString().trim() === '') return;

        let numbers = [];
        for(let i=1; i<=6; i++) {
           const val = row[`${game.key}_n${i}`];
           if(val) numbers.push(parseInt(val));
        }
        numbers.sort((a, b) => a - b);

        let ballsHtml = numbers.map(num => 
            `<div class="ball ${game.key}" style="transform: scale(1);">${num}</div>`
        ).join('');

        const comodin = row[`${game.key}_comodin`];
        const hasComodin = (comodin && comodin.toString().trim() !== '' && comodin != '0');
        const comodinHtml = hasComodin 
            ? `<div class="ball COMODIN" title="Comodín">${comodin}</div>` 
            : '';

        const ganadores = parseInt(row[`${game.key}_GANADORES`]) || 0;
        const monto = parseInt(row[`${game.key}_MONTO`]) || 0;
        
        let footerHtml = '';
        if (ganadores > 0) {
           footerHtml = `
             <div style="margin-top:auto; padding-top:1rem; border-top: 1px solid rgba(74, 222, 128, 0.3);">
                <div style="background: rgba(20, 83, 45, 0.4); border: 1px solid rgba(74, 222, 128, 0.4); border-radius: 12px; padding: 10px; text-align: center; box-shadow: 0 0 15px rgba(16,185,129,0.15);">
                   <div style="display:flex; justify-content:center; gap:5px; margin-bottom:4px;">
                      <span style="color:#4ade80; font-size:0.75rem; font-weight:bold; letter-spacing:1px; text-transform:uppercase;">¡${ganadores} Ganador(es)!</span>
                   </div>
                   <div style="font-size:1.2rem; font-weight:900; color:white; font-family:monospace;">
                      ${formatMoney(monto)}
                   </div>
                </div>
             </div>
           `;
        } else {
           footerHtml = `
             <div style="margin-top:auto; padding-top:1rem; border-top: 1px solid rgba(255,255,255,0.05);">
                <div style="background: rgba(255,255,255,0.05); border-radius: 12px; padding: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.05);">
                   <div style="font-size:0.75rem; color:#6b7280; text-transform:uppercase; letter-spacing:1px; font-weight:600; margin-bottom:4px;">Pozo Estimado</div>
                   <div style="font-size:1.1rem; font-weight:bold; color:rgba(255,255,255,0.8); font-family:monospace;">VACANTE</div>
                </div>
             </div>
           `;
        }

        slidesHtml += `
          <div class="swiper-slide" style="height: auto; padding: 5px;">
            <div style="position: relative; display: flex; flex-direction: column; height: 100%; background: #0f1525; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1.5rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);">
              <div style="position: relative; z-index: 10; text-align: center; margin-bottom: 1.5rem;">
                <h3 style="font-size: 1.5rem; font-weight: 900; font-style: italic; color: ${game.color}; text-shadow: 0 4px 6px rgba(0,0,0,0.3);">
                  ${game.title}
                </h3>
              </div>
              <div style="position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; margin-bottom: 1.5rem;">
                <div style="display: grid; grid-template-columns: auto auto; gap: 12px; justify-content: center;">
                    ${ballsHtml}
                </div>
                ${hasComodin ? `
                  <div style="display: flex; justify-content: center; margin-top: 15px; padding-top: 15px; border-top: 1px dashed rgba(255,255,255,0.1); width: 60%;">
                    ${comodinHtml}
                  </div>` : ''}
              </div>
              ${footerHtml}
            </div>
          </div>
        `;
      });

      swiperWrapper.innerHTML = slidesHtml;
      
      if(window.mySwiper) {
        window.mySwiper.update();
        window.mySwiper.slideTo(0);
      } else {
        window.mySwiper = new Swiper('.swiper', {
          slidesPerView: 1,
          spaceBetween: 20,
          centeredSlides: false,
          pagination: { el: '.swiper-pagination', clickable: true },
          breakpoints: {
            640: { slidesPerView: 1.2, centeredSlides: true },
            768: { slidesPerView: 2, centeredSlides: false },
            1024: { slidesPerView: 3, centeredSlides: false }
          }
        });
      }
    }

    function updateHistoryTable() {
      const checkbox = document.getElementById('filter-winners');
      const showWinnersOnly = checkbox ? checkbox.checked : false;
      let dataToRender = sortedData;

      if (showWinnersOnly) {
        dataToRender = sortedData.filter(r => parseInt(r.LOTO_GANADORES) > 0);
      }
      renderHistory(dataToRender.slice(0, 100));
    }

    function renderHistory(rows) {
      const tbody = document.getElementById('history-body');
      tbody.innerHTML = rows.map(r => {
        let nums = [];
        for(let i=1; i<=6; i++) {
           if(r[`LOTO_n${i}`]) nums.push(parseInt(r[`LOTO_n${i}`]));
        }
        nums.sort((a, b) => a - b);
        
        const numsStr = nums.join(' - ');
        const winner = (parseInt(r.LOTO_GANADORES) > 0);
        const dateStr = r.fecha ? r.fecha.split(' ')[0] : '-';

        return `
          <tr style="cursor:pointer; border-bottom: 1px solid rgba(255,255,255,0.1);" onclick="loadDraw('${r.sorteo}')" class="hover:bg-white/5 transition">
            <td style="padding:1rem; color:#00f2ff; font-weight:bold;">#${r.sorteo}</td>
            <td style="padding:1rem; color:#a0aec0;">${dateStr}</td>
            <td style="padding:1rem; color:white; font-family:monospace; font-size:1.1rem;">
                ${numsStr} 
                ${r.LOTO_comodin ? `<span style="color:#ff3b5c; margin-left:8px; font-weight:bold;">+ ${r.LOTO_comodin}</span>` : ''}
            </td>
            <td style="padding:1rem;">
                ${winner 
                  ? '<span style="background:rgba(0,255,157,0.2); color:#00ff9d; padding:4px 8px; border-radius:99px; font-size:0.8rem; font-weight:bold;">🏆 GANADOR</span>' 
                  : '<span style="color:#718096; font-size:0.9rem;">Vacante</span>'}
            </td>
          </tr>
        `;
      }).join('');
    }

    document.getElementById('search').addEventListener('change', (e) => {
      loadDraw(e.target.value);
    });
    document.getElementById('filter-winners').addEventListener('change', updateHistoryTable);

    window.loadDraw = (id) => {
      const row = allData.find(r => r.sorteo == id);
      if(row) {
        renderDashboard(row);
        document.getElementById('dashboard').scrollIntoView({behavior: 'smooth'});
      }
    }

    function initTimer() {
      const update = () => {
        const now = new Date();
        let next = new Date();
        next.setHours(21, 0, 0, 0);
        while(![0,2,4].includes(next.getDay()) || next < now) {
          next.setDate(next.getDate() + 1);
          next.setHours(21, 0, 0, 0);
        }
        const diff = next - now;
        const d = Math.floor(diff / (1000*60*60*24));
        const h = Math.floor((diff / (1000*60*60)) % 24);
        const m = Math.floor((diff / (1000*60)) % 60);
        const s = Math.floor((diff / 1000) % 60);
        
        const elDays = document.getElementById('days');
        const elHours = document.getElementById('hours');
        const elMins = document.getElementById('mins');
        const elSecs = document.getElementById('secs');

        if(elDays) elDays.innerText = d.toString().padStart(2, '0');
        if(elHours) elHours.innerText = h.toString().padStart(2, '0');
        if(elMins) elMins.innerText = m.toString().padStart(2, '0');
        if(elSecs) elSecs.innerText = s.toString().padStart(2, '0');
      };
      setInterval(update, 1000);
      update();
    }
    initTimer();
  </script>
</body>
</html>
