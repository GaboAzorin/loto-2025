<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LOTO AI • Dashboard Histórico</title>
  <meta name="description" content="Visualizador histórico inteligente del Loto Chile"/>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

  <style>
    :root {
      --bg: #050a14;
      --card: rgba(20, 30, 50, 0.65); 
      --card-hover: rgba(30, 40, 70, 0.8);
      --border: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
      --text-muted: #a0aec0;
      
      --neon-cyan: #00f2ff;
      --neon-pink: #ff00c8;
      --neon-purple: #bd00ff;
      --gold: #ffd700;
      --rose: #ff3864;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image: radial-gradient(circle at 50% 0%, rgba(0, 242, 255, 0.15) 0%, transparent 60%);
    }

    .container { max-width: 1400px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* Timer */
    .timer { display: flex; justify-content: center; gap: 1rem; margin: 2rem 0; flex-wrap: wrap; }
    .time-box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 1rem; padding: 1rem 1.5rem; text-align: center; min-width: 100px;
    }
    .time-num { font-size: 2.5rem; font-weight: 900; color: var(--neon-cyan); }
    .time-label { font-size: 0.8rem; color: var(--text-muted); letter-spacing: 1px; }

    /* Hero */
    .hero {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 2rem; padding: 2rem; margin: 2rem 0;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .hero-header { text-align: center; margin-bottom: 2rem; }
    .hero-title { font-size: 3rem; font-weight: 900; background: linear-gradient(to right, #fff, var(--neon-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero-date { color: var(--text-muted); font-size: 1.2rem; }

    .hero-stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 1.5rem; margin-bottom: 2rem;
      text-align: center;
    }
    .stat-val { font-size: 2rem; font-weight: 700; color: var(--neon-pink); }
    .stat-lbl { color: var(--text-muted); font-size: 0.9rem; }

    /* Swiper & Games */
    .swiper { padding-bottom: 3rem !important; }
    .game-slide { 
      background: rgba(10, 15, 30, 0.6); 
      border: 1px solid var(--border);
      padding: 1.5rem; border-radius: 1.5rem; height: 100%;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .game-name { font-size: 1.4rem; font-weight: 700; color: white; }
    .game-pozo { font-size: 0.9rem; color: var(--gold); font-family: 'JetBrains Mono', monospace; }

    .balls { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; margin: 1rem 0; }
    .ball {
      width: 45px; height: 45px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1.1rem; color: white;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    /* Colores dinámicos */
    .ball.LOTO { background: linear-gradient(135deg, #ffd700, #ff8c00); text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
    .ball.RECARGADO { background: linear-gradient(135deg, #ff00c8, #ff0055); }
    .ball.REVANCHA { background: linear-gradient(135deg, #bd00ff, #5d00ff); }
    .ball.DESQUITE { background: linear-gradient(135deg, #00f2ff, #0066ff); }
    .ball.JUBILAZO { background: linear-gradient(135deg, #00ff9d, #00aa55); color: #003311; }
    .ball.MULTIPLICAR { background: white; color: black; font-weight: 900; border-radius: 10px; }
    .ball.COMODIN { border: 2px solid #ff3b5c; background: transparent; color: #ff3b5c; }

    .winner-tag { 
      background: rgba(0, 255, 157, 0.15); color: #00ff9d; 
      padding: 0.2rem 0.6rem; border-radius: 99px; font-size: 0.8rem; font-weight: 700;
    }

    /* Tabla */
    .table-wrapper { 
      background: var(--card); border: 1px solid var(--border);
      border-radius: 1.5rem; overflow: hidden; margin-top: 3rem;
    }
    .table-scroll { max-height: 600px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { position: sticky; top: 0; background: #0a1020; padding: 1rem; text-align: left; color: var(--neon-cyan); z-index: 10;}
    td { padding: 1rem; border-bottom: 1px solid var(--border); }
    tr:hover { background: rgba(255,255,255,0.03); }

    /* Buscador */
    .search-container { max-width: 500px; margin: 0 auto 2rem; position: relative; }
    #search {
      width: 100%; padding: 1rem 1.5rem; border-radius: 99px;
      background: var(--card); border: 1px solid var(--border); color: white;
      font-size: 1.1rem; text-align: center;
    }
    #search:focus { outline: none; border-color: var(--neon-cyan); box-shadow: 0 0 20px rgba(0,242,255,0.2); }

    .status-bar { text-align: center; margin-top: 3rem; color: var(--text-muted); font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Timer -->
    <div class="timer">
      <div class="time-box"><div class="time-num" id="days">00</div><div class="time-label">DÍAS</div></div>
      <div class="time-box"><div class="time-num" id="hours">00</div><div class="time-label">HRS</div></div>
      <div class="time-box"><div class="time-num" id="mins">00</div><div class="time-label">MIN</div></div>
      <div class="time-box"><div class="time-num" id="secs">00</div><div class="time-label">SEG</div></div>
    </div>

    <!-- Buscador -->
    <div class="search-container">
      <input type="number" id="search" placeholder="🔍 Buscar sorteo (ej: 5352)..." />
    </div>

    <!-- Dashboard Principal -->
    <div class="hero" id="dashboard">
      <div class="hero-header">
        <div class="hero-date" id="dash-date">Cargando...</div>
        <h1 class="hero-title" id="dash-title">Sorteo #---</h1>
      </div>

      <div class="hero-stats">
        <div><div class="stat-val" id="dash-money">$0</div><div class="stat-lbl">Total Repartido Estimado</div></div>
        <div><div class="stat-val" id="dash-winners">0</div><div class="stat-lbl">Ganadores Totales</div></div>
      </div>

      <!-- Carrusel de Juegos -->
      <div class="swiper">
        <div class="swiper-wrapper" id="games-container"></div>
        <div class="swiper-pagination"></div>
      </div>
    </div>

    <!-- Historial -->
    <div class="table-wrapper">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Sorteo</th>
              <th>Fecha</th>
              <th>Números Loto</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </div>

    <div class="status-bar" id="status-text">Conectando con base de datos...</div>
  </div>

  <script>
    lucide.createIcons();
    let allData = [];

    // --- LÓGICA DINÁMICA DE JUEGOS ---
    function detectGamesInRow(row) {
      const games = [];
      const keys = Object.keys(row);

      // 1. Siempre buscar LOTO
      if (row.LOTO_n1) {
        games.push({
          id: 'LOTO', name: 'Loto Clásico', type: 'LOTO',
          nums: getNums(row, 'LOTO'),
          wild: row.LOTO_comodin,
          winners: +row.LOTO_GANADORES || 0,
          amount: +row.LOTO_MONTO || 0,
          pozo: row.LOTO_POZO_ACUMULADO
        });
      }

      // 2. Buscar Subjuegos estándar (Recargado, Revancha, Desquite, Ahora si que si)
      // Buscamos cualquier columna que termine en _n1 y no sea LOTO ni JUBILAZO
      keys.forEach(k => {
        if (k.endsWith('_n1') && !k.startsWith('LOTO') && !k.includes('JUBILAZO')) {
          const prefix = k.replace('_n1', '');
          // Mapeo de nombres para mostrar bonito
          let cleanName = prefix.replace(/_/g, ' '); 
          if(prefix === 'RECARGADO') cleanName = 'Recargado';
          if(prefix === 'REVANCHA') cleanName = 'Revancha';
          if(prefix === 'DESQUITE') cleanName = 'Desquite';

          // Buscar columnas de premios correspondientes
          // Nota: Tu parser a veces usa nombres largos para los premios (ej: RECARGADO_6_ACIERTOS_GANADORES)
          // Intentamos encontrar la columna de ganadores más parecida
          let winnersCol = keys.find(wk => wk.startsWith(prefix) && wk.includes('GANADORES'));
          let amountCol = keys.find(ak => ak.startsWith(prefix) && ak.includes('MONTO'));
          let pozoCol = keys.find(pk => pk.startsWith(prefix) && pk.includes('POZO'));

          games.push({
            id: prefix, name: cleanName, type: prefix,
            nums: getNums(row, prefix),
            winners: +row[winnersCol] || 0,
            amount: +row[amountCol] || 0,
            pozo: row[pozoCol]
          });
        }
      });

      // 3. Buscar Jubilazos (JUBILAZO_1, JUBILAZO_2, JUBILAZO_50ANOS...)
      keys.filter(k => k.includes('JUBILAZO') && k.endsWith('_n1')).forEach(k => {
        const prefix = k.replace('_n1', '');
        let name = "Jubilazo";
        if (prefix.includes('50ANOS')) name = "Jubilazo 50 Años";
        
        // Numeración visual (Jubilazo #1, #2...)
        const parts = prefix.split('_');
        const num = parts[parts.length-1];
        if(!isNaN(num)) name += ` #${num}`;

        games.push({
          id: prefix, name: name, type: 'JUBILAZO',
          nums: getNums(row, prefix),
          winners: 0, amount: 0 // Jubilazos suelen ser sueldos, difícil trackear monto total aquí
        });
      });

      // 4. Buscar Multiplicar
      if (row.MULTIPLICAR_FACTOR) {
        games.push({
          id: 'MULTI', name: 'Multiplicar', type: 'MULTIPLICAR',
          nums: [row.MULTIPLICAR_FACTOR],
          isSpecial: true
        });
      }

      return games;
    }

    function getNums(row, prefix) {
      const nums = [];
      for(let i=1; i<=6; i++) {
        const val = row[`${prefix}_n${i}`];
        if(val) nums.push(val);
      }
      return nums;
    }

    // --- CARGA DE DATOS ---
    try {
  // 3. CARGAR DATOS (CSV)
      Papa.parse('LOTO_HISTORIAL_MAESTRO.csv', {
        download: true,
        header: true,
        skipEmptyLines: true, // <--- Agregamos esto para ignorar filas vacías
        complete: function(results) {
          allData = results.data;
          
          // Filtramos para asegurarnos de tomar solo filas que tengan número de sorteo
          const validData = allData.filter(row => row.sorteo && row.sorteo.trim() !== '');
          
          // Tomamos el último de la lista válida
          const lastDraw = validData[validData.length - 1];
          
          if(lastDraw) {
            renderDashboard(lastDraw);
            
            // Actualizar el input del buscador con el número actual
            const searchInput = document.getElementById('search');
            if(searchInput) {
              searchInput.value = lastDraw.sorteo;
              searchInput.max = lastDraw.sorteo;
            }
          }
        }
      });
    } catch(e) {
      console.error("Error inicial:", e);
      document.getElementById('status-text').textContent = "Error al iniciar la carga de datos.";
    }

    // --- RENDERIZADO ---
    function renderDashboard(row) {
      // 1. Actualizar Textos
      // Asegúrate que estos IDs existan en tu HTML actual
      const elDate = document.getElementById('dash-date');
      const elTitle = document.getElementById('dash-title');
      
      if(elDate) elDate.innerText = row.fecha ? row.fecha.split(' ')[0] : '---';
      if(elTitle) elTitle.innerText = `Sorteo #${row.sorteo}`;

      // 2. Configuración de juegos
      const gamesConfig = [
        { key: 'LOTO', title: 'LOTO CLÁSICO', color: 'text-yellow-400' },
        { key: 'RECARGADO', title: 'RECARGADO', color: 'text-orange-400' },
        { key: 'REVANCHA', title: 'REVANCHA', color: 'text-red-400' },
        { key: 'DESQUITE', title: 'DESQUITE', color: 'text-emerald-400' },
        { key: 'AHORA_SI_QUE_SI', title: 'AHORA SÍ QUE SÍ', color: 'text-cyan-400' }
      ];

      const swiperWrapper = document.getElementById('games-container');
      let slidesHtml = '';

      gamesConfig.forEach(game => {
        // Validar si existe el juego
        const n1 = row[`${game.key}_n1`];
        if (!n1 || n1.toString().trim() === '') return;

        // --- LÓGICA DE ORDENAMIENTO (MAYOR A MENOR) ---
        let numbers = [];
        for(let i=1; i<=6; i++) {
           const val = row[`${game.key}_n${i}`];
           if(val) numbers.push(parseInt(val));
        }
        // Ordenar descendente (b - a)
        numbers.sort((a, b) => b - a);

        // Generar HTML de las bolitas usando la clase CSS .ball y el tipo de juego
        let ballsHtml = numbers.map(num => 
            `<div class="ball ${game.key}">${num}</div>`
        ).join('');

        // --- LÓGICA COMODÍN ---
        const comodin = row[`${game.key}_comodin`];
        const hasComodin = (comodin && comodin.toString().trim() !== '' && comodin != '0');
        // El comodín usa su propia clase .ball.COMODIN
        const comodinHtml = hasComodin 
            ? `<div class="ball COMODIN" title="Comodín">${comodin}</div>` 
            : '';

        // --- INFO PREMIO ---
        const ganadores = row[`${game.key}_GANADORES`];
        const monto = row[`${game.key}_MONTO`];
        
        let infoPremio = '';
        if (ganadores && parseInt(ganadores) > 0) {
           infoPremio = `<div class="text-xs text-green-400 font-bold">¡${ganadores} GANADOR(ES)!</div>
                         <div class="text-lg font-mono text-white">${formatMoney(monto || 0)}</div>`;
        } else {
           infoPremio = `<div class="text-xs text-gray-400 uppercase tracking-widest">Pozo Estimado / Vacante</div>
                         <div class="text-lg font-mono text-white">VACANTE</div>`;
        }

        // --- CONSTRUCCIÓN DEL SLIDE ---
        slidesHtml += `
          <div class="swiper-slide p-1">
            <div class="glass-panel rounded-2xl p-6 h-full flex flex-col justify-between relative overflow-hidden group" style="background: rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);">
              
              <div class="relative z-10 mb-4 border-b border-white/10 pb-2">
                <h3 class="text-xl font-black italic tracking-tighter ${game.color} drop-shadow-lg">
                  ${game.title}
                </h3>
              </div>

              <div class="balls relative z-10 justify-center mb-6">
                ${ballsHtml}
                ${comodinHtml}
              </div>

              <div class="bg-black/20 rounded-xl p-3 text-center relative z-10 backdrop-blur-sm border border-white/5">
                ${infoPremio}
              </div>
            </div>
          </div>
        `;
      });

      swiperWrapper.innerHTML = slidesHtml;
      
      // Reinicializar Swiper
      if(window.mySwiper) {
        window.mySwiper.update();
        window.mySwiper.slideTo(0);
      } else {
        window.mySwiper = new Swiper('.swiper', {
          slidesPerView: 1,
          spaceBetween: 20,
          pagination: { el: '.swiper-pagination', clickable: true },
          breakpoints: {
            640: { slidesPerView: 2 },
            1024: { slidesPerView: 3 }
          }
        });
      }
    }

    function renderHistory(rows) {
      const tbody = document.getElementById('history-body');
      tbody.innerHTML = rows.map(r => {
        const nums = getNums(r, 'LOTO').join(' • ');
        const winner = (+r.LOTO_GANADORES > 0);
        return `
          <tr style="cursor:pointer" onclick="loadDraw(${r.sorteo})">
            <td style="color:var(--neon-cyan)">#${r.sorteo}</td>
            <td>${r.fecha ? r.fecha.split(' ')[0] : '-'}</td>
            <td>${nums} ${r.LOTO_comodin ? `<span style="color:#ff3b5c">+ ${r.LOTO_comodin}</span>` : ''}</td>
            <td>${winner ? '🏆 GANADOR' : 'Vacante'}</td>
          </tr>
        `;
      }).join('');
    }

    // --- UTILIDADES ---
    window.loadDraw = (id) => {
      const row = allData.find(r => r.sorteo == id);
      if(row) {
        renderDashboard(row);
        document.getElementById('dashboard').scrollIntoView({behavior: 'smooth'});
      }
    }

    document.getElementById('search').addEventListener('change', (e) => {
      loadDraw(e.target.value);
    });

    function formatMoney(n) {
      return '$' + Number(n).toLocaleString('es-CL');
    }

    function initTimer() {
      const update = () => {
        const now = new Date();
        let next = new Date();
        next.setHours(21, 0, 0, 0);
        
        while(![0,2,4].includes(next.getDay()) || next < now) {
          next.setDate(next.getDate() + 1);
          next.setHours(21, 0, 0, 0);
        }
        
        const diff = next - now;
        
        const d = Math.floor(diff / (1000*60*60*24));
        const h = Math.floor((diff / (1000*60*60)) % 24);
        const m = Math.floor((diff / (1000*60)) % 60);
        const s = Math.floor((diff / 1000) % 60);

        // Actualizar las cajitas por separado
        const elDays = document.getElementById('days');
        const elHours = document.getElementById('hours');
        const elMins = document.getElementById('mins');
        const elSecs = document.getElementById('secs');

        if(elDays) elDays.innerText = d.toString().padStart(2, '0');
        if(elHours) elHours.innerText = h.toString().padStart(2, '0');
        if(elMins) elMins.innerText = m.toString().padStart(2, '0');
        if(elSecs) elSecs.innerText = s.toString().padStart(2, '0');
      };

      setInterval(update, 1000);
      update();
    }
    initTimer();
  </script>
</body>
</html>
