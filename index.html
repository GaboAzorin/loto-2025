<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loto Intelligence | Debug Mode</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
    
    <style>
        /* Estilos Base iguales pero simplificados para asegurar carga */
        :root { --bg-dark: #020617; --text-main: #f8fafc; --loto-color: #facc15; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Inter', sans-serif; padding: 1.5rem; }
        .container { max-width: 800px; margin: 0 auto; }
        
        /* Debug Box Styles */
        #debug-console {
            background: #330000; color: #ff9999; 
            padding: 1rem; border: 1px solid red; 
            margin-bottom: 1rem; font-family: monospace; 
            font-size: 0.8rem; display: none; word-wrap: break-word;
        }

        /* Estilos Visuales (Resumidos del anterior) */
        .main-card { background: rgba(30,41,59,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 2rem; text-align: center; margin-bottom: 2rem; }
        .ball { width: 45px; height: 45px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; color: #1e293b; margin: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .b-loto { background: var(--loto-color); width: 50px; height: 50px; font-size: 1.2rem; }
        .b-recargado { background: #38bdf8; }
        .b-revancha { background: #f472b6; }
        .b-desquite { background: #4ade80; }
        
        #loading { font-size: 1.2rem; color: #94a3b8; text-align: center; padding: 2rem; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    </style>
</head>
<body>

    <div class="container">
        <h1 style="text-align:center; margin-bottom:1rem;">Loto Monitor</h1>
        
        <div id="debug-console"></div>

        <div id="loading">
            Iniciando sistema...<br>
            <span style="font-size:0.8rem">Paso 1: Cargando Librerías...</span>
        </div>

        <div id="dashboard" style="display: none;">
            <div class="main-card">
                <div id="meta-info" style="color:#94a3b8; margin-bottom:1rem; text-transform:uppercase; font-size:0.8rem; letter-spacing:1px;">CARGANDO...</div>
                <div style="font-size:2rem; font-weight:900; margin-bottom:10px;">LOTO</div>
                <div id="loto-balls"></div>
            </div>

            <h3 style="text-align:center; color:#64748b; margin-bottom:1rem;">Resultados Adicionales</h3>
            <div style="text-align:center; margin-bottom:2rem;">
                <div style="color:#38bdf8; font-weight:bold; margin-bottom:5px;">RECARGADO</div>
                <div id="recargado-balls"></div>
            </div>
            
            <div style="background:rgba(255,255,255,0.05); padding:1rem; border-radius:10px;">
                <h4 style="margin:0 0 10px 0; border-bottom:1px solid #333; padding-bottom:5px;">Últimos Registros</h4>
                <div id="history-list" style="font-size:0.9rem; color:#cbd5e1;"></div>
            </div>
        </div>
    </div>

    <script>
        // --- SISTEMA DE DIAGNÓSTICO DE ERRORES ---
        function logError(msg) {
            const consoleDiv = document.getElementById('debug-console');
            const loadingDiv = document.getElementById('loading');
            consoleDiv.style.display = 'block';
            consoleDiv.innerHTML += "> " + msg + "<br>";
            loadingDiv.innerHTML = "⚠️ DETENIDO POR ERROR";
            loadingDiv.style.color = "#ff6b6b";
        }

        window.onerror = function(message, source, lineno, colno, error) {
            logError(`JS Error: ${message} (Línea ${lineno})`);
            return true;
        };

        // --- INICIO DEL PROGRAMA ---
        document.getElementById('loading').innerHTML = "Paso 2: Verificando PapaParse...";

        if (typeof Papa === 'undefined') {
            logError("FATAL: La librería PapaParse no cargó. Revisa tu conexión o bloqueo de scripts.");
        } else {
            document.getElementById('loading').innerHTML = "Paso 3: Descargando CSV...";
            
            // Agregamos '?t=' + Date.now() para OBLIGAR al celular a descargar la versión nueva y no usar caché
            const csvUrl = 'LOTO_HISTORIAL_MAESTRO.csv?t=' + Date.now(); 

            Papa.parse(csvUrl, {
                download: true,
                header: true,
                delimiter: ";", // Tu archivo usa punto y coma
                skipEmptyLines: true,
                complete: function(results) {
                    document.getElementById('loading').innerHTML = "Paso 4: Procesando Datos...";
                    
                    try {
                        const data = results.data;
                        if (!data || data.length === 0) {
                            throw new Error("El archivo CSV se descargó pero está VACÍO.");
                        }

                        // Ordenar (Más reciente primero)
                        const sortedData = data.reverse();
                        const latest = sortedData[0];

                        // Verificar si tenemos columnas válidas
                        if (!latest.LOTO_n1) {
                            throw new Error("No encuentro la columna 'LOTO_n1'. ¿El CSV usa punto y coma?");
                        }

                        // --- RENDERIZAR UI ---
                        
                        // Fecha y Sorteo
                        document.getElementById('meta-info').textContent = `SORTEO ${latest.sorteo} • ${latest.dia}/${latest.mes}/${latest.anio}`;

                        // Render Helper
                        const render = (row, prefix, cls) => {
                            let html = '';
                            for(let i=1; i<=6; i++) {
                                const val = row[`${prefix}_n${i}`];
                                if(val) html += `<div class="ball ${cls}">${val}</div>`;
                            }
                            return html;
                        };

                        // Loto
                        let lotoHtml = render(latest, 'LOTO', 'b-loto');
                        if(latest.LOTO_comodin) lotoHtml += `<div class="ball b-loto" style="background:white; border:3px solid #facc15;">${latest.LOTO_comodin}</div>`;
                        document.getElementById('loto-balls').innerHTML = lotoHtml;

                        // Recargado
                        document.getElementById('recargado-balls').innerHTML = render(latest, 'RECARGADO', 'b-recargado');

                        // Historial simple (Texto)
                        const historyDiv = document.getElementById('history-list');
                        if (sortedData.length > 1) {
                            sortedData.slice(1, 6).forEach(row => {
                                historyDiv.innerHTML += `<div style="padding:5px 0; border-bottom:1px solid #333;">#${row.sorteo} (${row.dia}/${row.mes})</div>`;
                            });
                        } else {
                            historyDiv.innerHTML = "<i>No hay historial anterior disponible.</i>";
                        }

                        // ÉXITO FINAL
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('dashboard').style.display = 'block';

                    } catch (e) {
                        logError("Error procesando datos: " + e.message);
                    }
                },
                error: function(err) {
                    // Este error suele ser un 404 (No encontrado)
                    logError("Fallo descarga CSV: " + err.name + " - " + err.message + ". <br>Verifica que el archivo 'LOTO_HISTORIAL_MAESTRO.csv' exista en el repo.");
                }
            });
        }
    </script>
</body>
</html>
