<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loto Intelligence | Analytics</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.6);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-border: 1px solid rgba(255, 255, 255, 0.08);
            
            /* Identidad de Juegos */
            --loto-color: #facc15;     /* Amarillo */
            --recargado-color: #38bdf8; /* Celeste */
            --revancha-color: #f472b6; /* Rosado */
            --desquite-color: #4ade80; /* Verde */
            --accent-stat: #8b5cf6;    /* Violeta para stats */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.08), transparent 25%), 
                radial-gradient(circle at 85% 30%, rgba(244, 114, 182, 0.08), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: var(--glass-border);
        }
        h1 { font-weight: 800; letter-spacing: -0.5px; font-size: 1.5rem; }
        
        .badge {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #34d399;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .badge::before {
            content: ''; display: block; width: 8px; height: 8px; 
            background: #34d399; border-radius: 50%;
            box-shadow: 0 0 8px #34d399;
        }

        /* --- NUEVO: BARRA DE ESTADÍSTICAS (DB STATS) --- */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.4);
            border: var(--glass-border);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            /* Borde izquierdo de color para decorar */
            border-left: 3px solid var(--accent-stat);
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
        }
        
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        /* HERO SECTION */
        .dashboard-grid {
            display: grid;
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .main-card {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 2rem;
            border: var(--glass-border);
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        .main-card::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--loto-color), transparent);
        }

        .draw-meta {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        /* SUB JUEGOS */
        .sub-games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }

        .game-card {
            background: var(--card-bg);
            border: var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
        }
        .game-card:hover { transform: translateY(-2px); background: rgba(40, 55, 75, 0.7); }

        .game-title {
            font-size: 0.8rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 1rem;
        }

        /* BOLAS */
        .balls-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
        .ball {
            width: 42px; height: 42px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 1.1rem; color: #1e293b;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .b-loto { background: var(--loto-color); width: 54px; height: 54px; font-size: 1.4rem; }
        .b-comodin { background: white; border: 3px solid var(--loto-color); }
        .b-recargado { background: var(--recargado-color); color: #0f172a; }
        .b-revancha { background: var(--revancha-color); color: #0f172a; }
        .b-desquite { background: var(--desquite-color); color: #0f172a; }

        /* TABLA HISTORIAL */
        .history-section { margin-top: 3rem; }
        .history-header { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 1rem; }
        
        .table-wrapper {
            background: var(--card-bg);
            border-radius: 16px;
            border: var(--glass-border);
            overflow-x: auto; 
        }
        
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { background: rgba(0,0,0,0.2); color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
        td { font-size: 0.9rem; }
        
        .mini-set { display: flex; gap: 2px; }
        .mini-ball {
            width: 20px; height: 20px; border-radius: 50%;
            background: rgba(255,255,255,0.1);
            text-align: center; line-height: 20px; font-size: 0.65rem; color: #ccc;
        }
        .mini-ball.active { background: var(--loto-color); color: black; font-weight: bold; }

        #loading { text-align: center; padding: 4rem; color: var(--text-muted); }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            .b-loto { width: 40px; height: 40px; font-size: 1rem; }
            .ball { width: 32px; height: 32px; font-size: 0.9rem; }
            .stats-row { grid-template-columns: 1fr 1fr; } /* 2 col en móvil */
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Loto Intelligence</h1>
            <div class="badge" id="system-status">System Active</div>
        </header>

        <div class="stats-row" id="stats-panel" style="display:none;">
            <div class="stat-card">
                <div class="stat-value" id="stat-total">0</div>
                <div class="stat-label">Total Sorteos</div>
            </div>
            <div class="stat-card" style="border-left-color: #3b82f6;">
                <div class="stat-value" id="stat-first-year">----</div>
                <div class="stat-label">Datos Desde</div>
            </div>
            <div class="stat-card" style="border-left-color: #10b981;">
                <div class="stat-value" id="stat-last-date">--/--</div>
                <div class="stat-label">Última Actualización</div>
            </div>
        </div>

        <div id="loading">Iniciando análisis de datos...</div>

        <div id="dashboard" style="display: none;">
            
            <div class="dashboard-grid">
                <div class="main-card">
                    <div class="draw-meta" id="meta-info">Cargando...</div>
                    <div style="color: var(--loto-color); margin-bottom: 10px; font-weight:600;">LOTO CLÁSICO</div>
                    <div class="balls-row" id="loto-balls"></div>
                </div>

                <div class="sub-games-grid">
                    <div class="game-card">
                        <div class="game-title" style="color: var(--recargado-color)">Recargado</div>
                        <div class="balls-row" id="recargado-balls"></div>
                    </div>
                    <div class="game-card">
                        <div class="game-title" style="color: var(--revancha-color)">Revancha</div>
                        <div class="balls-row" id="revancha-balls"></div>
                    </div>
                    <div class="game-card">
                        <div class="game-title" style="color: var(--desquite-color)">Desquite</div>
                        <div class="balls-row" id="desquite-balls"></div>
                    </div>
                </div>
            </div>

            <div class="history-section">
                <div class="history-header">Historial Reciente</div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Sorteo</th>
                                <th>Fecha</th>
                                <th>Loto</th>
                                <th>Recargado</th>
                                <th>Revancha</th>
                            </tr>
                        </thead>
                        <tbody id="history-body"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        const csvUrl = 'LOTO_HISTORIAL_MAESTRO.csv'; 

        function renderBalls(row, prefix, cssClass, count=6) {
            let html = '';
            for(let i=1; i<=count; i++) {
                const val = row[`${prefix}_n${i}`];
                if(val !== undefined && val !== "") {
                    html += `<div class="ball ${cssClass}">${val}</div>`;
                }
            }
            return html;
        }

        Papa.parse(csvUrl, {
            download: true,
            header: true,
            delimiter: ";",
            skipEmptyLines: true,
            complete: function(results) {
                const data = results.data;
                
                if (data.length > 0) {
                    // 1. LÓGICA DE ESTADÍSTICAS (NUEVO)
                    // Ordenamos para tener el último primero en la visual, 
                    // pero necesitamos encontrar el "más antiguo" para el año.
                    
                    // Clonamos para no afectar orden si quisiéramos
                    const sortedData = [...data].reverse(); 
                    const latest = sortedData[0];
                    const oldest = sortedData[sortedData.length - 1];

                    // Inyectar Stats
                    document.getElementById('stat-total').textContent = data.length.toLocaleString();
                    document.getElementById('stat-first-year').textContent = oldest.anio || '????';
                    document.getElementById('stat-last-date').textContent = `${latest.dia}/${latest.mes}`;
                    
                    document.getElementById('stats-panel').style.display = 'grid';


                    // 2. UI DASHBOARD
                    document.getElementById('meta-info').textContent = `SORTEO Nº ${latest.sorteo} • ${latest.dia}/${latest.mes}/${latest.anio}`;

                    // Bolas
                    let lotoHtml = renderBalls(latest, 'LOTO', 'b-loto');
                    lotoHtml += `<div class="ball b-loto b-comodin" title="Comodín">${latest.LOTO_comodin}</div>`;
                    document.getElementById('loto-balls').innerHTML = lotoHtml;

                    document.getElementById('recargado-balls').innerHTML = renderBalls(latest, 'RECARGADO', 'b-recargado');
                    document.getElementById('revancha-balls').innerHTML = renderBalls(latest, 'REVANCHA', 'b-revancha') || '<span style="opacity:0.5; font-size:0.8rem">No disponible</span>';
                    document.getElementById('desquite-balls').innerHTML = renderBalls(latest, 'DESQUITE', 'b-desquite') || '<span style="opacity:0.5; font-size:0.8rem">No disponible</span>';

                    // Tabla Historial
                    const historyBody = document.getElementById('history-body');
                    const historyData = sortedData.slice(1, 16); 

                    historyData.forEach(row => {
                        const tr = document.createElement('tr');
                        const miniHTML = (prefix) => {
                            let h = '<div class="mini-set">';
                            for(let i=1; i<=6; i++) {
                                let v = row[`${prefix}_n${i}`];
                                if(v) h += `<div class="mini-ball ${prefix === 'LOTO' ? 'active' : ''}">${v}</div>`;
                            }
                            return h + '</div>';
                        };

                        tr.innerHTML = `
                            <td style="font-weight:bold; color:white;">#${row.sorteo}</td>
                            <td style="color: #94a3b8;">${row.dia}/${row.mes}</td>
                            <td>${miniHTML('LOTO')}</td>
                            <td>${miniHTML('RECARGADO')}</td>
                            <td>${miniHTML('REVANCHA')}</td>
                        `;
                        historyBody.appendChild(tr);
                    });

                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                }
            },
            error: function(err) {
                document.getElementById('loading').innerHTML = "Error crítico de lectura: " + err;
                document.getElementById('system-status').style.color = 'red';
                document.getElementById('system-status').textContent = 'Offline';
            }
        });
    </script>
</body>
</html>
