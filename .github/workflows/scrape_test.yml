name: Scraping API Final

on:
  workflow_dispatch:

jobs:
  scrape-api:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Instalar requests
        run: pip install requests

      - name: 🕷️ Ejecutar Scraper
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }} 
        run: python engine/scrapers/test_gh_action.py

      - name: 📤 Guardar resultados (Éxito o Debug)
        if: always() # Se ejecuta aunque falle el python
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          
          # Agregamos todo lo que empiece con resultado_ o debug_
          git add resultado_nube_final.json || true
          git add debug_*.html || true
          git add debug_*.png || true
          
          git commit -m "🕷️ Reporte de Ejecución (Auto)" || echo "Nada nuevo"
          git push