name: Test Scrape Loto #5200

on:
  workflow_dispatch:  # Permite ejecutarlo manualmente desde la pestaña Actions
  # schedule:
  #   - cron: '0 12 * * *'  # Opcional: diario a mediodía UTC

jobs:
  scrape-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright playwright-extra playwright-extra-plugin-stealth
          playwright install chromium --with-deps

      - name: Run test scraper
        run: |
          python engine/scrapers/test_scrap_grok.py

      # Opcional: subir incluso si no hay cambios (no necesario)