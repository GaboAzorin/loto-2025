name: Scraping Nube con ScraperAPI

on:
  workflow_dispatch: # Esto habilita el botón manual "Run workflow"

jobs:
  scrape-proxy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso crucial para que el bot pueda guardar los archivos

    steps:
      - name: 📥 Descargar código (Checkout)
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Instalar dependencias
        run: pip install requests

      - name: 🕷️ Ejecutar Scraper (Vía ScraperAPI)
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }} # <--- Aquí inyectamos el secreto
        run: python engine/scrapers/test_gh_action.py   # <--- Ruta corregida a tu carpeta real

      - name: 📤 Guardar cambios (Commit & Push)
        if: always() # Se ejecuta siempre, incluso si falla (para subir logs de error si los hay)
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          
          # Intentamos agregar tanto el resultado exitoso como el de error
          git add resultado_nube_scraperapi.json || true
          git add debug_scraperapi.html || true
          
          # Hacemos commit solo si hay algo nuevo
          git commit -m "☁️ Resultado ScraperAPI (Auto)" || echo "⚠️ Nada nuevo que guardar"
          git push