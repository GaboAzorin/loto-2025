name: Scraping Playwright + Proxy

on:
  workflow_dispatch:

jobs:
  scrape-proxy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Instalar dependencias
        run: |
          pip install playwright requests
          playwright install chromium --with-deps

      - name: 🕷️ Ejecutar Scraper
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }} 
        run: python engine/scrapers/test_gh_action.py

      - name: 📤 Guardar cambios
        if: always()
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add resultado_nube_playwright.json || true
          git add debug_error.html || true
          git commit -m "🕷️ Resultado Playwright Proxy" || echo "Nada nuevo"
          git push