name: Soñador (Generador de Predicciones)

on:
  schedule:
    - cron: '*/15 * * * *' # Ejecutar cada 15 minutos
  workflow_dispatch: # Permite ejecución manual desde GitHub Actions

permissions:
  contents: write

jobs:
  dream:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install pandas numpy scikit-learn scipy

    - name: Ejecutar Bot Dreamer
      run: python engine/models/bot_dreamer.py

    - name: Sincronizar y Guardar (Retry Logic Blindado)
      run: |
        git config --global user.name 'LotoAI Bot'
        git config --global user.email 'bot@lotoai.com'
        
        # --- FASE 1: COMMIT LOCAL (Asegurar el trabajo) ---
        # Primero guardamos lo que generó el bot en un commit local.
        # Esto evita el error "cannot pull with rebase: You have unstaged changes".
        
        git add data/queue/
        git add data/loto_genome.json || true
        git add data/loto_biometrics.json || true
        git add data/*.pkl || true
        git add data/LOTO_SIMULACIONES.csv || true
        
        # Verificamos si hay cambios reales antes de hacer commit
        if git diff-index --quiet HEAD; then
          echo "💤 Nada nuevo que guardar (el Bot no generó predicciones o no hubo cambios)."
          exit 0
        else
          git commit -m "🧠 Bot: Predicción + Auto-ajuste"
        fi

        # --- FASE 2: SINCRONIZACIÓN (El Bucle de la Perseverancia) ---
        MAX_RETRIES=10
        COUNT=0
        SUCCESS=0
        
        while [ $COUNT -lt $MAX_RETRIES ]; do
          echo "🔄 Intento de sincronización $COUNT/$MAX_RETRIES..."
          
          # Intentamos traer cambios remotos y aplicar nuestro commit encima (Rebase)
          if git pull origin main --rebase; then
            
            # Si el rebase funcionó, intentamos subir
            if git push origin main; then
              echo "✅ Éxito: Predicciones subidas al multiverso."
              SUCCESS=1
              break
            else
              echo "⚠️ Push rechazado (alguien más subió cambios milisegundos antes). Reintentando..."
            fi
            
          else
            echo "⚠️ Conflicto en Pull/Rebase. Abortando rebase para limpiar y reintentar..."
            # Si falla el rebase, hay que abortarlo para volver al estado del commit local y probar de nuevo
            git rebase --abort
          fi
          
          # Espera aleatoria entre 5 y 15 segundos para evitar colisiones repetidas
          sleep $((RANDOM % 10 + 5))
          COUNT=$((COUNT+1))
        done
        
        if [ $SUCCESS -eq 0 ]; then
          echo "❌ Error crítico: Imposible sincronizar tras $MAX_RETRIES intentos."
          exit 1
        fi