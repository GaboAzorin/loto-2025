name: Bot Soñador (Generador de Predicciones)

on:
  schedule:
    - cron: '*/15 * * * *' # Corre cada 15 minutos
  workflow_dispatch: # Permite correrlo manualmente

permissions:
  contents: write

jobs:
  dream:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Evita que se quede colgado eternamente

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    # --- AGREGADO: Sincronizar antes de ejecutar ---
    - name: Pull latest changes
      run: git pull origin main
    # -----------------------------------------------

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install pandas numpy pytz

    - name: Run Bot Dreamer
      run: python engine/models/bot_dreamer.py

    - name: Commit and Push
      run: |
        git config --global user.name 'LotoAI Bot'
        git config --global user.email 'bot@lotoai.com'
        # Git pull por seguridad otra vez (no daña)
        git add data/LOTO_SIMULACIONES.csv
        git commit -m "🤖 Nueva predicción generada por Bot Soñador" || exit 0
        git push