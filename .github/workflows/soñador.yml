name: Bot Soñador (Multiverso)

on:
  schedule:
    - cron: '*/15 * * * *' # Corre cada 15 minutos
  workflow_dispatch: # Botón manual en GitHub

permissions:
  contents: write

jobs:
  dream:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Reducido a 10 para evitar procesos zombies

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3
      with:
        ref: main

    - name: Sincronizar estado inicial
      run: |
        git config pull.rebase false
        git pull origin main || echo "Repositorio ya actualizado"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # --- OPTIMIZACIÓN: CACHÉ ---
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # --- FASE 0: PREPARACIÓN (MUEVE LA COLA AL CSV) ---
    - name: 0. Consolidar Cola de Predicciones
      run: python engine/tools/consolidar_cola.py

    # --- FASE 1: AUDITORÍA (El Pasado) ---
    - name: 1. Ejecutar Juez Implacable
      run: python engine/models/juez_implacable.py

    # --- FASE 2: APRENDIZAJE (La Retrospectiva) ---
    - name: 2. Ejecutar Entrenador Cognitivo
      run: python engine/models/entrenador_cognitivo.py

    # --- FASE 3: BIOMETRÍA (El Presente) ---
    - name: 3. Actualizar Biometría
      run: python engine/models/generador_biometrico.py

    # --- FASE 4: PREDICCIÓN (El Futuro) ---
    # Genera tickets JSON en data/queue/
    - name: 4. Ejecutar Bot Dreamer
      run: python engine/models/bot_dreamer.py

    # --- FASE 5: PERSISTENCIA (CRÍTICO: GESTIÓN DE COLA) ---
    - name: Guardar Predicciones e Inteligencia (Concurrencia Segura)
      run: |
        git config --global user.name 'LotoAI Bot'
        git config --global user.email 'bot@lotoai.com'
        
        # Intentar hasta 5 veces la sincronización
        MAX_RETRIES=5
        COUNT=0
        SUCCESS=0
        
        while [ $COUNT -lt $MAX_RETRIES ]; do
          # 1. Traer lo último del universo (Pull con Rebase es clave)
          git pull origin main --rebase
          
          # 2. Agregar cambios
          git add data/queue/
          git add data/loto_genome.json || true
          git add data/loto_biometrics.json || true  # <--- AGREGADO: Importante para la web
          git add data/*.pkl || true
          git add data/LOTO_SIMULACIONES.csv || true
          
          # 3. Commit (Si no hay cambios, esto falla y el script sale limpio)
          if git commit -m "🧠 Bot: Predicción + Auto-ajuste [Try $COUNT]"; then
            # 4. Intentar Push
            if git push origin main; then
              echo "✅ Sincronización exitosa."
              SUCCESS=1
              break
            else
              echo "⚠️ Push falló (alguien más subió cambios justo ahora). Reintentando..."
            fi
          else
            echo "💤 Nada nuevo que guardar."
            SUCCESS=1
            break
          fi
          
          # Esperar un poco antes de reintentar (backoff aleatorio)
          sleep $((RANDOM % 10 + 5))
          COUNT=$((COUNT+1))
        done
        
        if [ $SUCCESS -eq 0 ]; then
          echo "❌ Error crítico: No se pudo sincronizar después de $MAX_RETRIES intentos."
          exit 1
        fi