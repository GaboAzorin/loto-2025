name: Bot Soñador (Generador de Predicciones)

on:
  schedule:
    - cron: '*/15 * * * *' # Corre cada 15 minutos
  workflow_dispatch: # Permite correrlo manualmente

# --- ESTO ES LO QUE FALTABA (PERMISOS DE ESCRITURA) ---
permissions:
  contents: write
# ------------------------------------------------------

jobs:
  dream:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install pandas numpy pytz

    - name: Run Bot Dreamer
      run: python bot_dreamer.py

    - name: Commit and Push
      run: |
        git config --global user.name 'LotoAI Bot'
        git config --global user.email 'bot@lotoai.com'
        # Usamos 'git pull' antes para evitar conflictos si hubo cambios mientras corría
        git pull
        git add LOTO_SIMULACIONES.csv
        git commit -m "🤖 Nueva predicción generada por Bot Soñador" || exit 0
        git push