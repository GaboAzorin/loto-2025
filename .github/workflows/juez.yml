name: Juez Implacable (Auditoría Multiverso)

on:
  push:
    paths:
      - 'data/*_MAESTRO.csv' # Se activa al subir nuevos resultados reales
  workflow_dispatch: # Botón manual

permissions:
  contents: write

jobs:
  judge:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install pandas numpy

    # 0. El consolidador (Aquí se borran los 7.000 archivos del DISCO)
    - name: 0. Consolidar Cola de Predicciones
      run: python engine/tools/consolidar_cola.py

    # 1. AUDITORÍA
    - name: Ejecutar Juez Multiverso
      run: python engine/models/juez_implacable.py

    # 2. APRENDIZAJE
    - name: Ejecutar Entrenador Cognitivo
      run: python engine/models/entrenador_cognitivo.py

    - name: Actualizar Biometría
      run: python engine/models/generador_biometrico.py

    # 3. GUARDADO BLINDADO (Commit Local + Rebase Loop)
    - name: Publicar Veredictos e Inteligencia
      run: |
        git config --global user.name 'Juez LotoAI'
        git config --global user.email 'juez@lotoai.com'
        
        # --- FASE 1: COMMIT LOCAL ---
        # 'git add .' es mágico:
        # 1. Agrega el CSV modificado.
        # 2. Agrega los JSON de inteligencia actualizados.
        # 3. ¡Registra la ELIMINACIÓN de los 7.000 archivos de la cola!
        git add .
        
        if git diff-index --quiet HEAD; then
          echo "⚖️ Todo en orden, no hubo cambios de auditoría."
          exit 0
        else
          git commit -m "⚖️ Ciclo de Verdad: Auditoría y Limpieza completados"
        fi

        # --- FASE 2: SINCRONIZACIÓN ROBUSTA ---
        MAX_RETRIES=10
        COUNT=0
        SUCCESS=0
        
        while [ $COUNT -lt $MAX_RETRIES ]; do
          echo "🔄 Sincronizando Juez con el Multiverso (Intento $COUNT/$MAX_RETRIES)..."
          
          if git pull origin main --rebase; then
            if git push origin main; then
              echo "✅ Veredicto dictado y guardado."
              SUCCESS=1
              break
            else
              echo "⚠️ Push rechazado. Reintentando..."
            fi
          else
            echo "⚠️ Conflicto en Rebase. Reintentando..."
            git rebase --abort
            git stash || true
          fi
          
          sleep $((RANDOM % 10 + 5))
          COUNT=$((COUNT+1))
        done
        
        if [ $SUCCESS -eq 0 ]; then
          echo "❌ Error: El Juez no pudo dictar sentencia tras varios intentos."
          exit 1
        fi