name: Juez Implacable (Auditoría Multiverso)

on:
  push:
    paths:
      - 'data/*_MAESTRO.csv' # Se activa solo si subes resultados nuevos (Loto, Racha, etc.)
  workflow_dispatch: # Botón manual
  schedule:
    - cron: '0 */6 * * *' # <--- NUEVO: Ejecutar cada 6 horas para limpieza automática (Conserje)

permissions:
  contents: write

jobs:
  judge:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install pandas numpy

    # 0. El consolidador (Aquí se borran los archivos JSON del DISCO tras unirse al CSV)
    - name: 0. Consolidar Cola de Predicciones
      run: python engine/tools/consolidar_cola.py

    # 1. AUDITORÍA: Revisa si ganamos algo con los datos nuevos
    - name: Ejecutar Juez Multiverso
      run: python engine/models/juez_implacable.py

    # 2. APRENDIZAJE: Actualiza el Genoma y la Biometría al instante
    - name: Ejecutar Entrenador Cognitivo
      run: python engine/models/entrenador_cognitivo.py

    - name: Actualizar Biometría
      run: python engine/models/generador_biometrico.py

    # 3. GUARDADO BLINDADO (Commit Local + Rebase Loop)
    - name: Publicar Veredictos e Inteligencia
      run: |
        git config --global user.name 'Juez LotoAI'
        git config --global user.email 'juez@lotoai.com'
        
        # --- FASE 1: COMMIT LOCAL ---
        # 'git add .' es la clave:
        # 1. Agrega el CSV modificado con las nuevas filas.
        # 2. Agrega los JSON de inteligencia actualizados.
        # 3. ¡Registra la ELIMINACIÓN de los archivos de la cola que borró Python!
        git add .
        
        # Verificamos si hay algo que guardar
        if git diff-index --quiet HEAD; then
          echo "⚖️ Todo en orden, no hubo cambios de auditoría ni limpieza pendiente."
          exit 0
        else
          git commit -m "⚖️ Ciclo de Verdad: Auditoría y Limpieza completados"
        fi

        # --- FASE 2: SINCRONIZACIÓN ROBUSTA (El Bucle de la Perseverancia) ---
        MAX_RETRIES=10
        COUNT=0
        SUCCESS=0
        
        while [ $COUNT -lt $MAX_RETRIES ]; do
          echo "🔄 Sincronizando Juez con el Multiverso (Intento $COUNT/$MAX_RETRIES)..."
          
          # Intentamos traer cambios remotos (ej: predicciones nuevas del bot)
          if git pull origin main --rebase; then
            
            # Si entramos bien, intentamos subir nuestros cambios
            if git push origin main; then
              echo "✅ Veredicto dictado y guardado."
              SUCCESS=1
              break
            else
              echo "⚠️ Push rechazado. Reintentando..."
            fi
            
          else
            echo "⚠️ Conflicto en Rebase. Reintentando..."
            # Si falla el rebase, abortamos y protegemos cambios para intentar de nuevo
            git rebase --abort
            git stash || true 
          fi
          
          # Espera aleatoria para evitar colisiones constantes
          sleep $((RANDOM % 10 + 5))
          COUNT=$((COUNT+1))
        done
        
        if [ $SUCCESS -eq 0 ]; then
          echo "❌ Error: El Juez no pudo dictar sentencia tras varios intentos."
          exit 1
        fi