name: Juez Implacable (Auditoría Multiverso)

on:
  push:
    paths:
      - 'data/*_MAESTRO.csv' # Se activa solo si subes resultados nuevos (Loto, Racha, etc.)
  workflow_dispatch: # Botón manual

permissions:
  contents: write

jobs:
  judge:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install pandas numpy

    # 0. El consolidador
    - name: 0. Consolidar Cola de Predicciones
      run: python engine/tools/consolidar_cola.py

    # 1. AUDITORÍA: Revisa si ganamos algo con los datos nuevos
    - name: Ejecutar Juez Multiverso
      run: python engine/models/juez_implacable.py

    # 2. APRENDIZAJE: Actualiza el Genoma y la Biometría al instante
    - name: Ejecutar Entrenador Cognitivo
      run: python engine/models/entrenador_cognitivo.py

    - name: Actualizar Biometría
      run: python engine/models/generador_biometrico.py

    # 3. GUARDADO: Sube los veredictos (CSV) y la nueva inteligencia (JSON)
    - name: Publicar Veredictos e Inteligencia
      run: |
        git config --global user.name 'Juez LotoAI'
        git config --global user.email 'juez@lotoai.com'
        
        git pull origin main # Sincronizar por seguridad
        
        # Agregamos las simulaciones auditadas
        git add data/LOTO_SIMULACIONES.csv
        
        # Agregamos los archivos de inteligencia actualizados
        git add data/*.json

        git add -u data/queue/
        
        git commit -m "⚖️ Ciclo de Verdad: Auditoría y Aprendizaje completados tras carga" || echo "Sin cambios nuevos"
        git push