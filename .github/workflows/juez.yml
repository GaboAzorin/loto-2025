name: Juez Implacable (Auditoría Multiverso)

on:
  push:
    paths:
      - 'data/*_MAESTRO.csv' # Se activa solo si subes resultados nuevos (Loto, Racha, etc.)
  workflow_dispatch: # Botón manual

permissions:
  contents: write

jobs:
  judge:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install pandas numpy

    - name: Ejecutar Juez Multiverso
      run: python engine/models/juez_implacable.py

    - name: Publicar Veredictos
      run: |
        git config --global user.name 'Juez LotoAI'
        git config --global user.email 'juez@lotoai.com'
        
        git pull origin main # Sincronizar por si el Bot escribió algo mientras tanto
        
        git add data/LOTO_SIMULACIONES.csv
        git commit -m "⚖️ Juez: Auditoría completada tras carga de datos" || echo "Sin veredictos nuevos"
        git push