name: Juez Implacable (Auditoría)

on:
  push:
    paths:
      - 'LOTO_HISTORIAL_MAESTRO.csv' # Solo se activa si cambia este archivo

jobs:
  judge:
    runs-on: ubuntu-latest
    permissions:
      contents: write # IMPORTANTE: Permiso para escribir el resultado

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install pandas numpy

    - name: Run Juez Implacable
      run: python juez_implacable.py

    - name: Commit and Push Results
      run: |
        git config --global user.name 'Juez LotoAI'
        git config --global user.email 'juez@lotoai.com'
        git add LOTO_SIMULACIONES.csv
        git commit -m "⚖️ Auditoría completada tras actualización de resultados" || exit 0
        git push