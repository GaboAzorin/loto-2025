name: Loto Sniper Live

on:
  schedule:
    # --- ESTRATEGIA UNIFICADA INVIERNO/VERANO ---
    # Chile varía entre UTC-3 y UTC-4.
    # Configuramos para cubrir desde las 01:30 UTC hasta las 10:00 UTC.
    # Días Chile: Dom(0), Mar(2), Jue(4) -> UTC siempre cae Lun(1), Mie(3), Vie(5)

    # 1. FASE DE ATAQUE (La hora crítica del sorteo)
    # Cubre de 22:30 a 23:55 (CL Verano) Y TAMBIÉN cubre 21:30 a 22:55 (CL Invierno)
    # Al ampliar el rango UTC de 01 a 02, aseguramos cobertura rápida siempre.
    - cron: '30,35,40,45,50,55 1 * * 1,3,5'   # 01:30 - 01:55 UTC
    - cron: '*/5 2 * * 1,3,5'                 # 02:00 - 02:55 UTC

    # 2. FASE DE MANTENIMIENTO (Post-Sorteo inmediato)
    # Cubre la madrugada temprana
    - cron: '*/10 3 * * 1,3,5'                # 03:00 - 03:50 UTC

    # 3. FASE DE GUARDIA (Madrugada profunda)
    - cron: '*/20 4 * * 1,3,5'                # 04:00 - 04:40 UTC

    # 4. FASE FINAL (Hasta la mañana siguiente)
    # Extendemos hasta las 10 UTC para cubrir hasta las 06:00 AM en Invierno
    - cron: '0 5-10 * * 1,3,5'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo'
        default: 'daily' # Por defecto ejecuta la lógica diaria
        type: choice
        options:
        - history
        - daily

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Instalar deps
        run: pip install pandas beautifulsoup4 lxml curl_cffi pytz

      - name: Configurar Git Global
        run: |
          git config --global user.name 'LotoBot'
          git config --global user.email 'bot@noreply.github.com'

      - name: Ejecutar Sniper
        # Pasamos 'daily' como argumento para que Python sepa qué hacer
        run: python scraper.py daily
