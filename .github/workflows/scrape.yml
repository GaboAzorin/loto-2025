name: Loto Sniper Live

on:
  schedule:
    # --- ESTRATEGIA DE ALTA FRECUENCIA ---
    # Chile Verano es UTC-3.
    # Los sorteos son Domingo, Martes, Jueves a las 21:30 aprox.
    # Ejecutamos los: Lunes(1), Miércoles(3), Viernes(5) en UTC.
    # 01:00 UTC = 22:00 Chile (noche del sorteo)
    # 13:00 UTC = 10:00 Chile (mañana siguiente)
    # Corre cada 30 minutos (*/30)
    - cron: '*/30 1-13 * * 1,3,5'
  
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de ejecución'
        default: 'daily'
        type: choice
        options:
        - daily
        - history

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Instalar dependencias
        run: pip install pandas beautifulsoup4 lxml curl_cffi pytz

      - name: Configurar Git Global
        run: |
          git config --global user.name 'LotoBot'
          git config --global user.email 'bot@noreply.github.com'

      - name: Ejecutar Sniper
        # Corrección: Pasamos el modo correctamente al script
        run: |
          MODO="${{ inputs.mode }}"
          if [ -z "$MODO" ]; then MODO="daily"; fi
          echo "Ejecutando en modo: $MODO"
          python scraper.py "$MODO"

      - name: Subir Log de Ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ejecucion
          path: ejecucion.log