name: Loto Sniper System

on:
  schedule:
    # 02:00 UTC = 23:00 Chile (aprox)
    # Ejecutar días Martes, Jueves, Domingo (y Lunes, Miercoles, Viernes UTC por el cambio de hora)
    # Para seguridad, corremos todos los días a las 23:00 Chile
    - cron: '0 2 * * *' 
  
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de Ejecución'
        required: true
        default: 'daily'
        type: choice
        options:
        - daily
        - history

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Instalar deps
        run: pip install pandas beautifulsoup4 lxml curl_cffi

      - name: Ejecutar Sniper
        # Si es schedule, corre daily. Si es manual, usa el input.
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            python scraper.py daily
          else
            python scraper.py ${{ inputs.mode }}
          fi

      - name: Guardar Evidencia
        if: always()
        run: |
          git config --global user.name 'LotoBot'
          git config --global user.email 'bot@noreply.github.com'
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Loto DB [${{ inputs.mode || 'daily' }}]" && git push)
