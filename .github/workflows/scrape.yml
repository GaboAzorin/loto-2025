name: Loto Sniper Live

on:
  schedule:
    # Horarios superpuestos Invierno/Verano
    - cron: '30,35,40,45,50,55 1 * * 1,3,5'
    - cron: '*/5 2 * * 1,3,5'
    - cron: '*/10 3 * * 1,3,5'
    - cron: '*/20 4 * * 1,3,5'
    - cron: '0 5-10 * * 1,3,5'
  
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de ejecución'
        default: 'daily'
        type: choice
        options:
        - daily
        - history

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Instalar dependencias
        run: pip install pandas beautifulsoup4 lxml curl_cffi pytz

      - name: Configurar Git Global
        run: |
          git config --global user.name 'LotoBot'
          git config --global user.email 'bot@noreply.github.com'

      - name: Ejecutar Sniper
        # AQUI ESTA EL CAMBIO CRUCIAL:
        # Si es un evento manual (dispatch), usa el input. Si es cron, usa 'daily'.
        run: |
          MODO="${{ inputs.mode }}"
          if [ -z "$MODO" ]; then MODO="daily"; fi
          echo "Ejecutando en modo: $MODO"
          python scraper.py $MODO

      # OPCIONAL: Subir el archivo log como artefacto para que lo puedas descargar
      - name: Subir Log de Ejecución
        if: always() # Se ejecuta aunque el python falle
        uses: actions/upload-artifact@v4
        with:
          name: logs-ejecucion
          path: ejecucion.log
