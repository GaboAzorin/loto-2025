name: Actualizar Loto DB

on:
  schedule:
    # Ejecutar a las 09:00 UTC (aprox 6:00 AM Chile) todos los días
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite ejecutar manualmente desde un botón

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Ejecutar Scraper
        run: python scraper.py

      - name: Commit y Push si hay cambios
        run: |
          git config --global user.name 'LotoBot'
          git config --global user.email 'bot@noreply.github.com'
          git add .    # <--- EL PUNTO ES VITAL
          git diff --quiet && git diff --staged --quiet || (git commit -m "Diagnóstico guardado" && git push)
