name: Actualizar Loto DB

on:
  schedule:
    - cron: '0 9 * * *' # 6:00 AM Chile aprox
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      # AQUÍ ESTÁ EL TRUCO:
      - name: Ejecutar Scraper
        id: run_script
        continue-on-error: true   # <--- ¡ESTO ES VITAL! Si falla, sigue igual.
        run: python scraper.py

      # ESTE PASO SE EJECUTA SIEMPRE, AUNQUE EL ANTERIOR FALLE
      - name: Subir Evidencia (Commit Forense)
        if: always()              # <--- Obliga a guardar cambios pase lo que pase
        run: |
          git config --global user.name 'LotoBot'
          git config --global user.email 'bot@noreply.github.com'
          git add .
          # El comando "|| echo" evita que falle si no hay cambios
          git commit -m "Reporte de ejecución (Éxito o Fallo)" || echo "Nada nuevo que guardar"
          git push
