name: Loto Sniper Live

on:
  schedule:
    - cron: '0 2 * * *' 
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo'
        default: 'history'
        type: choice
        options:
        - history
        - daily

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Instalar deps
        run: pip install pandas beautifulsoup4 lxml curl_cffi

      # CONFIGURAMOS GIT ANTES DE CORRER PYTHON
      - name: Configurar Git Global
        run: |
          git config --global user.name 'LotoBot'
          git config --global user.email 'bot@noreply.github.com'

      - name: Ejecutar Sniper (Con Live Push)
        run: python scraper.py history
