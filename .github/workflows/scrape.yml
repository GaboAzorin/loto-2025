name: Loto Sniper Live

on:
  schedule:
    # --- CONFIGURACIÓN DE HORARIOS (UTC-3 Chile Verano) ---
    # Días Chile: Domingo (0), Martes (2), Jueves (4)
    # Al pasar a UTC (+3h), caen en: Lunes (1), Miércoles (3), Viernes (5)

    # 1. FASE INTENSIVA: 22:30 a 22:55 CL (Cada 5 min)
    # Hora CL: 22:30, 22:35... -> Hora UTC: 01:30, 01:35...
    - cron: '30,35,40,45,50,55 1 * * 1,3,5'

    # 2. FASE MEDIA: 23:00 a 23:50 CL (Cada 10 min)
    # Hora CL: 23:00... -> Hora UTC: 02:00...
    - cron: '*/10 2 * * 1,3,5'

    # 3. FASE LENTA: 00:00 a 00:40 CL (Cada 20 min)
    # Hora CL: 00:00... -> Hora UTC: 03:00...
    - cron: '*/20 3 * * 1,3,5'

    # 4. FASE FINAL: 01:00 a 06:00 CL (Cada 1 hora)
    # Hora CL: 01:00... -> Hora UTC: 04:00 hasta 09:00
    - cron: '0 4-9 * * 1,3,5'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo'
        default: 'daily'
        type: choice
        options:
        - history
        - daily

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Instalar deps
        run: pip install pandas beautifulsoup4 lxml curl_cffi

      - name: Configurar Git Global
        run: |
          git config --global user.name 'LotoBot'
          git config --global user.email 'bot@noreply.github.com'

      # Pasamos el argumento 'daily' explícitamente
      - name: Ejecutar Sniper
        run: python scraper.py daily
