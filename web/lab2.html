<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Loto Lab v12.5 - Centro de Inferencia</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding-bottom: 50px; }
        .header-main { text-align: center; padding: 2rem 0; background: #1e293b; border-bottom: 1px solid #334155; }
        h1 { margin: 0; text-transform: uppercase; letter-spacing: 3px; font-size: 1.5rem; color: #f1f5f9; }
        
        /* Headers de sección */
        .section-title { padding: 2rem 2rem 0 2rem; color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; display: flex; align-items: center; gap: 10px; }
        .section-title::after { content: ""; height: 2px; flex-grow: 1; background: #334155; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 1.5rem; padding: 1.5rem 2rem; }
        
        .card { background: #1e293b; border-radius: 12px; padding: 1.5rem; border: 1px solid #334155; position: relative; }
        .high-conf { border-color: #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.15); }
        .disident-card { 
            border: 2px solid #f43f5e; box-shadow: 0 0 20px rgba(244, 63, 94, 0.25); 
            background: linear-gradient(145deg, #1e293b 0%, #2d161b 100%);
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(244, 63, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
        }

        .numbers { font-size: 1.8rem; font-weight: 800; color: #fbbf24; letter-spacing: 2px; margin: 15px 0; text-align: center; }
        .tag { font-size: 0.7rem; font-weight: 600; padding: 4px 8px; border-radius: 4px; background: #0ea5e9; color: white; }
        .badge-disidencia { background: #f43f5e; color: white; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 5px; }

        /* Estilos de tiempo */
        .time-box { background: rgba(0,0,0,0.2); border-radius: 6px; padding: 8px; margin-bottom: 10px; font-size: 0.8rem; }
        .time-row { display: flex; justify-content: space-between; margin: 2px 0; }
        .time-label { color: #94a3b8; }
        .time-value { color: #f1f5f9; font-weight: bold; }

        .confidence-bar { height: 8px; background: #334155; border-radius: 4px; margin: 12px 0; }
        .confidence-fill { height: 100%; background: #38bdf8; border-radius: 4px; }
        .footer-info { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px; border-top: 1px solid #334155; padding-top: 10px; }
    </style>
</head>
<body>

    <div class="header-main">
        <h1>🔬 Laboratorio de Sueños Colectivos</h1>
    </div>

    <h2 class="section-title">🔵 Predicciones LOTO</h2>
    <div class="grid" id="grid-LOTO"></div>

    <h2 class="section-title">🟡 Predicciones LOTO 3</h2>
    <div class="grid" id="grid-LOTO3"></div>

    <script>
        const JUEGOS_PERMITIDOS = ["LOTO", "LOTO3"];

        async function loadPredictions() {
            try {
                const response = await fetch('../dashboard_data.json');
                const rawData = await response.json();
                
                // Limpiamos los contenedores
                document.getElementById('grid-LOTO').innerHTML = '';
                document.getElementById('grid-LOTO3').innerHTML = '';

                // Ordenar por sorteo (más nuevos primero)
                rawData.sort((a, b) => {
                    // Primero por número de sorteo (descendente)
                    if (b.sorteo_objetivo !== a.sorteo_objetivo) {
                        return b.sorteo_objetivo - a.sorteo_objetivo;
                    }
                    // Si es el mismo sorteo, la de mayor confianza primero
                    return b.score_afinidad - a.score_afinidad;
                });

                rawData.forEach(item => {
                    if (item.juego === "LOTO") renderCard(item, 'grid-LOTO');
                    if (item.juego === "LOTO3") renderCard(item, 'grid-LOTO3');
                });

                // Si una sección está vacía
                if (!document.getElementById('grid-LOTO').innerHTML) document.getElementById('grid-LOTO').innerHTML = "<p>Sin predicciones para Loto.</p>";
                if (!document.getElementById('grid-LOTO3').innerHTML) document.getElementById('grid-LOTO3').innerHTML = "<p>Sin predicciones para Loto 3.</p>";

            } catch (error) {
                console.error("Error cargando predicciones:", error);
            }
        }

        function renderCard(data, containerId) {
            let numerosArr = Array.isArray(data.numeros) ? data.numeros : JSON.parse(data.numeros.replace(/'/g, '"'));

            const isDisident = data.nota_especial === 'ALERTA_DISIDENCIA';
            const isHigh = data.score_afinidad > 25 && !isDisident;
            
            let cardClass = "card";
            if (isDisident) cardClass += " disident-card";
            else if (isHigh) cardClass += " high-conf";

            const html = `
                <div class="${cardClass}">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <div>
                            <span class="tag">SORTEO #${data.sorteo_objetivo}</span>
                            ${isDisident ? '<span class="badge-disidencia">V4 RESCUE</span>' : ''}
                        </div>
                        <span style="font-weight:bold; font-size:0.75rem; color:${isDisident ? '#f43f5e' : (isHigh ? '#10b981' : '#64748b')}">
                            ${isDisident ? '🚀 DISIDENCIA' : (isHigh ? '🔥 ALTA' : '⚖️ NORMAL')}
                        </span>
                    </div>

                    <div class="time-box">
                        <div class="time-row">
                            <span class="time-label">📅 Lanzamiento:</span>
                            <span class="time-value">${data.fecha_lanzamiento || 'Cargando...'}</span>
                        </div>
                        <div class="time-row" style="font-size:0.7rem; opacity:0.7;">
                            <span class="time-label">🤖 Soñado el:</span>
                            <span>${data.fecha_generacion}</span>
                        </div>
                    </div>

                    <p class="numbers">${numerosArr.join(' - ')}</p>

                    <div class="confidence-bar">
                        <div class="confidence-fill" style="width: ${data.score_afinidad}%"></div>
                    </div>

                    <div class="footer-info">
                        <div>
                            <small style="color:#94a3b8; display:block; font-size:0.6rem;">CONFIANZA ML</small>
                            <span style="font-weight:bold; color:#f1f5f9">${data.score_afinidad}%</span>
                        </div>
                        <div style="text-align:right">
                            <small style="color:#64748b; font-size: 0.6rem;">ALGORITMO</small>
                            <small style="color:#94a3b8; display:block; font-size:0.7rem;">${data.algoritmo}</small>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById(containerId).innerHTML += html;
        }

        loadPredictions();
    </script>
</body>
</html>
