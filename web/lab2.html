<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Loto Lab v12.4 - Loto & Loto 3 Exclusive</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; }
        h1 { padding-top: 2rem; color: #f1f5f9; text-transform: uppercase; letter-spacing: 3px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; padding: 2rem; }
        
        /* Estilos de Card */
        .card { 
            background: #1e293b; 
            border-radius: 12px; 
            padding: 1.5rem; 
            border: 1px solid #334155; 
            transition: transform 0.2s ease;
            position: relative;
        }
        
        .high-conf { border-color: #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.15); }
        
        .disident-card { 
            border: 2px solid #f43f5e; 
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.25); 
            background: linear-gradient(145deg, #1e293b 0%, #2d161b 100%);
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(244, 63, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
        }

        .numbers { font-size: 1.7rem; font-weight: 800; color: #fbbf24; letter-spacing: 2px; margin: 15px 0; }
        .tag { font-size: 0.75rem; font-weight: 600; padding: 4px 10px; border-radius: 6px; background: #0ea5e9; color: white; }
        .badge-disidencia { background: #f43f5e; color: white; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 5px; }

        .confidence-bar { height: 8px; background: #334155; border-radius: 4px; margin: 12px 0; }
        .confidence-fill { height: 100%; background: #38bdf8; border-radius: 4px; }
        
        .footer-info { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px; }
    </style>
</head>
<body>
    <h1 style="text-align:center">🧠 Laboratorio de Sueños</h1>
    <p style="text-align:center; color: #94a3b8; margin-top: -15px;">Solo LOTO y LOTO 3 (Filtrado Activo)</p>
    
    <div class="grid" id="predictions-grid"></div>

    <script>
        // CONFIGURACIÓN: Juegos permitidos
        const JUEGOS_PERMITIDOS = ["LOTO", "LOTO3"];

        // Ahora cargamos los datos REALES del archivo consolidado
        async function loadPredictions() {
            try {
                // El archivo dashboard_data.json es generado por tu pipeline de Python
                const response = await fetch('../dashboard_data.json');
                const rawData = await response.json();
                
                // Limpiamos el grid
                document.getElementById('predictions-grid').innerHTML = '';

                // Aplicamos el filtro para mostrar solo LOTO y LOTO3
                const filteredData = rawData.filter(item => JUEGOS_PERMITIDOS.includes(item.juego));
                
                // Ordenamos por sorteo_objetivo de forma descendente
                filteredData.sort((a, b) => b.sorteo_objetivo - a.sorteo_objetivo);

                if (filteredData.length === 0) {
                    document.getElementById('predictions-grid').innerHTML = 
                        '<p style="text-align:center; color:#64748b">No hay predicciones pendientes para Loto o Loto 3.</p>';
                    return;
                }

                filteredData.forEach(renderCard);
                
            } catch (error) {
                console.error("Error cargando predicciones:", error);
                document.getElementById('predictions-grid').innerHTML = 
                    '<p style="text-align:center; color:#ef4444">Error al cargar datos. ¿Se ha generado dashboard_data.json?</p>';
            }
        }

        function renderCard(data) {
            // 1. Verificación de seguridad: si los números vienen como string "[1, 2...]", los convertimos a lista
            let numerosArr = data.numeros;
            if (typeof data.numeros === 'string') {
                try {
                    // Reemplaza comillas simples por dobles si existen y parsea
                    numerosArr = JSON.parse(data.numeros.replace(/'/g, '"'));
                } catch (e) {
                    console.error("Error parseando números:", e);
                    numerosArr = [];
                }
            }

            const isDisident = data.nota_especial === 'ALERTA_DISIDENCIA';
            const isHigh = data.score_afinidad > 25 && !isDisident;
            
            let cardClass = "card";
            if (isDisident) cardClass += " disident-card";
            else if (isHigh) cardClass += " high-conf";

            // Usamos el array procesado numerosArr
            const html = `
                <div class="${cardClass}">
                    <div style="display:flex; justify-content:space-between; align-items:center">
                        <div>
                            <span class="tag">${data.juego} #${data.sorteo_objetivo}</span>
                            ${isDisident ? '<span class="badge-disidencia">RESCUE V4</span>' : ''}
                        </div>
                        <span style="font-weight:bold; font-size:0.8rem; color:${isDisident ? '#f43f5e' : (isHigh ? '#10b981' : '#64748b')}">
                            ${isDisident ? '🚀 DISIDENCIA' : (isHigh ? '🔥 ALTA' : '⚠️ RUIDO')}
                        </span>
                    </div>

                    <p class="numbers">${numerosArr.join(' - ')}</p>

                    <div class="confidence-bar">
                        <div class="confidence-fill" style="width: ${data.score_afinidad}%"></div>
                    </div>

                    <div class="footer-info">
                        <div>
                            <small style="color:#94a3b8; display:block">Confianza</small>
                            <span style="font-weight:bold; color:#f1f5f9">${data.score_afinidad}%</span>
                        </div>
                        <div style="text-align:right">
                            <small style="color:#64748b; font-size: 0.65rem">ALGORITMO</small>
                            <small style="color:#94a3b8; display:block">${data.algoritmo}</small>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('predictions-grid').innerHTML += html;
        }

        loadPredictions();
    </script>
</body>
</html>
